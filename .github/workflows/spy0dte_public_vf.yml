name: SPY 0DTE Public Vix Fix

# The PUBLIC account's own strategy ("vfrev", Vix Fix reversal): spy0dte/vfbot.js + spy0dte/vfrev.js.
# Separate from the Robinhood dot bot: its own state/logs/summaries/trades.csv in spy0dte/vfrev/, its own concurrency group.
# Orders go ONLY to Public. DRY RUN unless the repo variable SPY0DTE_PUBLIC_VF_LIVE is set to exactly: yes
on:
  schedule:
    - cron: "20 13 * * 1-5"   # 9:20 AM New York in summer (EDT)
    - cron: "20 14 * * 1-5"   # 9:20 AM New York in winter (EST); the bot ignores whichever one isn't 9:20
  workflow_dispatch:
    inputs:
      mode:
        description: "run = today's session, check = test the key + buying power (no orders)"
        default: "check"
      clear_review:
        description: "yes = clear the 2-of-10 stop hold after you've reviewed"
        default: "no"
      reset:
        description: "yes = reset this bot's ledger (dry-run balance back to $1,000)"
        default: "no"
      restart:
        description: "yes = start again today after a stop (mode must be run; refuses if anything is open)"
        default: "no"

permissions:
  contents: write
  issues: write

concurrency:
  group: spy0dte-public-vf   # separate from the Robinhood bot and the twin
  cancel-in-progress: false

jobs:
  vfrev:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest repo
        run: git pull --ff-only origin main || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the Public Vix Fix bot
        env:
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API_SECRET }}
          PUBLIC_ACCOUNT_ID: ${{ vars.PUBLIC_ACCOUNT_ID }}
          SPY0DTE_PUBLIC_VF_LIVE: ${{ vars.SPY0DTE_PUBLIC_VF_LIVE }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          CLEAR_REVIEW: ${{ github.event.inputs.clear_review || 'no' }}
          RESET: ${{ github.event.inputs.reset || 'no' }}
          RESTART: ${{ github.event.inputs.restart || 'no' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'yes' || '' }}
        run: node spy0dte/vfbot.js
      - name: Save this bot's files
        if: always()
        run: |
          git config user.name "spy0dte-public-vf"
          git config user.email "spy0dte-bot@users.noreply.github.com"
          git add spy0dte/vfrev 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "spy0dte public vix fix $(TZ=America/New_York date +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 10; done
          fi
      - name: Send the summary (GitHub issue = phone notification)
        if: always() && (github.event.inputs.mode || 'run') == 'run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(TZ=America/New_York date +%F)
          F="spy0dte/vfrev/summaries/$D.md"
          if [ -f "$F" ]; then
            gh issue create --title "SPY 0DTE PUBLIC VIX FIX · $D · $(cat "spy0dte/vfrev/summaries/$D.title")" --body-file "$F" || true
          fi
