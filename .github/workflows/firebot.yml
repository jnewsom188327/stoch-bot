name: Fire bot

on:
  schedule:
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "25 18 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test only, run = trade now"
        default: "run"
      reset:
        description: "yes = put the bankroll back to $2,500"
        default: "no"

permissions:
  contents: write

concurrency:
  group: firebot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Get latest trade log + open trades
        run: git pull --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run Fire bot (PAPER)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          RESET: ${{ github.event.inputs.reset || 'no' }}
        run: python firebot.py
      - name: Save trade log
        if: always()
        run: |
          git config user.name "firebot"
          git config user.email "firebot@users.noreply.github.com"
          for f in fire_trades.csv fire_signals.csv fire_fills.csv fire_state.json fire_book.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "firebot log $(date -u +%F)"
            git pull --rebase origin main || true
            git push || true
          fi
