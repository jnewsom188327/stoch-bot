name: Clean Scan replay (real option prices)

# DATA ONLY. This workflow downloads historical option bars and writes a report.
# It does not place orders and it does not change the Clean Scan bot.
# Trigger it by hand: Actions tab, this workflow, Run workflow.
# A fresh run, not Re-run.
on:
  workflow_dispatch:
    inputs:
      trades:
        description: "Trade log in the repo (one row per sale)"
        default: "clean_trades.csv"
      half_spread_cents:
        description: "Extra half-spread floor in cents per side (the run uses the larger of this and the percent below)"
        default: "1"
      half_spread_pct:
        description: "Extra half-spread as a percent of premium per side"
        default: "0.5"
      commission:
        description: "Commission in dollars per contract per side"
        default: "0.65"
      results_branch:
        description: "Branch that receives the result files. main and master are refused."
        default: "cleanbot-replay-results"

permissions:
  contents: write

concurrency:
  group: cleanbot-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests (no market data, no orders)
        run: python -m pytest -q tests/test_cleanbot_replay.py
      - name: Replay logged trades on OPRA 1-minute bars (data only, no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          CLEAN_TRADES: ${{ github.event.inputs.trades }}
          CLEAN_HALF_SPREAD_CENTS: ${{ github.event.inputs.half_spread_cents }}
          CLEAN_HALF_SPREAD_PCT: ${{ github.event.inputs.half_spread_pct }}
          CLEAN_COMMISSION: ${{ github.event.inputs.commission }}
          CLEAN_REPLAY_OUT: results
        run: python cleanbot_replay.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanbot-replay-results
          path: |
            results/CLEANBOT_REPLAY.md
            results/cleanbot_replay_trades.csv
          if-no-files-found: warn
      - name: Commit results onto the results branch (never main)
        if: success()
        env:
          RESULTS_BRANCH: ${{ github.event.inputs.results_branch }}
        run: |
          set -euo pipefail
          BRANCH="${RESULTS_BRANCH:-cleanbot-replay-results}"
          case "$BRANCH" in
            main|master|origin/main|origin/master)
              echo "Refusing to push results to ${BRANCH}"
              exit 1
              ;;
          esac
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing results branch name"
            exit 1
          fi
          mkdir -p /tmp/cleanbot-replay-out
          cp -f results/CLEANBOT_REPLAY.md results/cleanbot_replay_trades.csv /tmp/cleanbot-replay-out/
          # Untracked generated files block checkout once the results branch
          # tracks these paths. Copies in /tmp are restored after the switch.
          rm -f results/CLEANBOT_REPLAY.md results/cleanbot_replay_trades.csv
          git config user.name "cleanbot-replay"
          git config user.email "cleanbot-replay@users.noreply.github.com"
          git fetch origin "$BRANCH" || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi
          HEADBR="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$HEADBR" = "main" ] || [ "$HEADBR" = "master" ]; then
            echo "Refusing to commit results on ${HEADBR}"
            exit 1
          fi
          mkdir -p results
          cp -f /tmp/cleanbot-replay-out/CLEANBOT_REPLAY.md /tmp/cleanbot-replay-out/cleanbot_replay_trades.csv results/
          git add results/CLEANBOT_REPLAY.md results/cleanbot_replay_trades.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "clean scan replay $(date -u +%F)"
          git push origin "HEAD:${BRANCH}"
