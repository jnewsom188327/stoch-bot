name: Trend Flip backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Tickers, comma separated"
        default: "SPY,QQQ"
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2020-01-01"
      tfs:
        description: "Chart minutes, comma separated"
        default: "2,3"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run backtest (data only - no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
          START: ${{ github.event.inputs.start }}
          TFS: ${{ github.event.inputs.tfs }}
        run: python backtest.py
      - name: Save results
        if: always()
        run: |
          git config user.name "stoch-bot"
          git config user.email "stoch-bot@users.noreply.github.com"
          if [ -d results ]; then git add results; fi
          if ! git diff --cached --quiet; then
            git commit -m "backtest results $(date -u +%F)"
            git pull --rebase origin main || true
            git push || true
          fi
