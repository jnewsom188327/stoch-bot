name: Clean Scan bot

on:
  schedule:
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "25 18 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test only, run = trade now"
        default: "run"

permissions:
  contents: write

concurrency:
  group: cleanbot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Get latest trade log + open trades
        run: git pull --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run Clean Scan bot (PAPER)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: python cleanbot.py
      - name: Save trade log
        if: always()
        run: |
          git config user.name "cleanbot"
          git config user.email "cleanbot@users.noreply.github.com"
          for f in clean_trades.csv clean_state.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "cleanbot log $(date -u +%F)"
            git pull --rebase origin main || true
            git push || true
          fi
