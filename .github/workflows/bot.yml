name: stoch-bot

on:
  schedule:
    # Weekdays. Covers both summer (EDT) and winter (EST) time. Only one run at a time;
    # the bot itself waits for the open, stops at 4 PM ET and skips market holidays.
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "25 18 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test keys only, run = trade now"
        default: "check"

permissions:
  contents: write

concurrency:
  group: stoch-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Get latest trade log
        run: git pull --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: python bot.py
      - name: Save trade log
        if: always()
        run: |
          git config user.name "stoch-bot"
          git config user.email "stoch-bot@users.noreply.github.com"
          if [ -f trades.csv ]; then git add trades.csv; fi
          if [ -f shadow_b.csv ]; then git add shadow_b.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "trade log $(date -u +%F)"
            git pull --rebase origin main || true
            git push || true
          fi
