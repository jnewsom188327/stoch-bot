name: Fear-greed fade (real option prices)

# DATA ONLY. This workflow downloads historical bars and writes a report.
# It does not place orders. Trigger it by hand: Actions tab, this workflow, Run workflow.
# A fresh run, not Re-run.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Recent completed trading days to score"
        default: "120"
      tfs:
        description: "Chart minutes, comma separated. Subset of 1,3,5."
        default: "1,3,5"
      results_branch:
        description: "Branch that receives the result files. main and master are refused."
        default: "fgfade-results"

permissions:
  contents: write

concurrency:
  group: fgfade
  cancel-in-progress: false

jobs:
  fade:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests (no market data, no orders)
        run: python -m pytest -q tests/test_fgfade.py
      - name: Greed/fear fade on real OPRA prints (data only, no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FG_DAYS: ${{ github.event.inputs.days }}
          FG_TFS: ${{ github.event.inputs.tfs }}
          FG_WORKERS: "4"
        run: python fgfade.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fgfade-results
          path: |
            results/FGFADE.md
            results/fgfade_summary.csv
            results/fgfade_trades.csv
            results/fgfade_folds.csv
          if-no-files-found: warn
      - name: Commit results onto the results branch (never main)
        if: success()
        env:
          RESULTS_BRANCH: ${{ github.event.inputs.results_branch }}
        run: |
          set -euo pipefail
          BRANCH="${RESULTS_BRANCH:-fgfade-results}"
          case "$BRANCH" in
            main|master|origin/main|origin/master)
              echo "Refusing to push results to ${BRANCH}"
              exit 1
              ;;
          esac
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing results branch name"
            exit 1
          fi
          mkdir -p /tmp/fgfade-out
          cp -f results/FGFADE.md results/fgfade_summary.csv results/fgfade_trades.csv results/fgfade_folds.csv /tmp/fgfade-out/
          # Untracked generated files block checkout once the results branch
          # tracks these paths. Copies in /tmp are restored after the switch.
          rm -f results/FGFADE.md results/fgfade_summary.csv results/fgfade_trades.csv results/fgfade_folds.csv
          git config user.name "fgfade"
          git config user.email "fgfade@users.noreply.github.com"
          git fetch origin "$BRANCH" || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi
          HEADBR="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$HEADBR" = "main" ] || [ "$HEADBR" = "master" ]; then
            echo "Refusing to commit results on ${HEADBR}"
            exit 1
          fi
          mkdir -p results
          cp -f /tmp/fgfade-out/FGFADE.md /tmp/fgfade-out/fgfade_summary.csv /tmp/fgfade-out/fgfade_trades.csv /tmp/fgfade-out/fgfade_folds.csv results/
          git add results/FGFADE.md results/fgfade_summary.csv results/fgfade_trades.csv results/fgfade_folds.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "fgfade results $(date -u +%F)"
          git push origin "HEAD:${BRANCH}"
