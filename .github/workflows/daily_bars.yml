name: Daily bars for the stress test
on:
  schedule:
    - cron: "20 21 * * 1-5"   # 4:20 PM New York in winter (5:20 PM in summer), weekdays
  workflow_dispatch:
    inputs:
      days:
        description: "Days to pull, like 2026-11-16 (blank = today plus any missed days this week)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  bars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull today so far from Public (temp branch)
        env:
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API_SECRET }}
          DAY: ${{ inputs.days }}
        run: node spy0dte/pull_public.js
      - name: Save
        run: |
          git config user.name "stoch-bot"
          git config user.email "stoch-bot@users.noreply.github.com"
          git add results
          if ! git diff --cached --quiet; then
            git commit -m "daily bars $(date -u +%F)"
            for i in 1 2 3 4 5; do git push origin HEAD:partial-pull -f && break; sleep 10; done
          fi
