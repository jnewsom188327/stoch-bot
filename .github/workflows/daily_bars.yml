name: Daily bars for the stress test
on:
  schedule:
    - cron: "20 21 * * 1-5"   # 4:20 PM New York in winter (5:20 PM in summer), weekdays
  workflow_dispatch:
    inputs:
      days:
        description: "Days to pull, like 2026-11-16 (blank = today plus any missed days this week)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  bars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pull SPY and option prices (data only - no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          DAYS_IN: ${{ inputs.days }}
          MIN_BARS: "100"
        run: |
          if [ -n "$DAYS_IN" ]; then
            export BARS_DAYS="$DAYS_IN"
          else
            D=""
            for k in 0 1 2 3 4 5 6 7; do
              d=$(TZ=America/New_York date -d "-$k day" +%F)
              if [ "$(date -d "$d" +%u)" -le 5 ] && [ ! -f "results/bars_$d.json" ]; then D="$D,$d"; fi
            done
            export BARS_DAYS="${D#,}"
          fi
          echo "Pulling: ${BARS_DAYS:-today}"
          python bars_daily.py
      - name: Save
        run: |
          git config user.name "stoch-bot"
          git config user.email "stoch-bot@users.noreply.github.com"
          git add results
          if ! git diff --cached --quiet; then
            git commit -m "daily bars $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 10; done
          fi
