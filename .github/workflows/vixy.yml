name: VIXY history (data only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pull VIXY 1-minute bars (no orders)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python - <<'EOF'
          from datetime import datetime, timedelta, timezone
          from bars_daily import fetch_1m
          end = datetime.now(timezone.utc) - timedelta(minutes=20)
          df, feed = fetch_1m("VIXY", datetime(2025, 10, 20, tzinfo=timezone.utc), end)
          df.to_csv("results/vixy_1m.csv.gz", compression="gzip")
          print("VIXY", len(df), "bars", feed)
          EOF
      - name: Save
        if: always()
        run: |
          git config user.name "stoch-bot"
          git config user.email "stoch-bot@users.noreply.github.com"
          git add results/vixy_1m.csv.gz 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "VIXY history"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 10; done
          fi
