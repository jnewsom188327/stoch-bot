name: SPY 0DTE twin (Public, dry run, original rules)

# A second copy of the bot for a side-by-side test. Same marks and times as the live bot, but:
#   - ALWAYS a dry run: no order is ever sent (bot.js forces this for any SPY0DTE_TAG run)
#   - the ORIGINAL rules: first strike out of the money, full port (trend sizing off)
#   - its own state, logs, summaries and trades.csv in spy0dte/twin_public/
on:
  schedule:
    - cron: "20 13 * * 1-5"   # 9:20 AM New York in summer (EDT)
    - cron: "20 14 * * 1-5"   # 9:20 AM New York in winter (EST); the bot ignores whichever isn't 9:20
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: spy0dte-twin   # separate from the live bot
  cancel-in-progress: false

jobs:
  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest repo
        run: git pull --ff-only origin main || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the twin (dry run)
        env:
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API_SECRET }}
          PUBLIC_ACCOUNT_ID: ${{ vars.PUBLIC_ACCOUNT_ID }}
          SPY0DTE_TAG: public
          SPY0DTE_BROKER: public
          SPY0DTE_LIVE: "no"
          SPY0DTE_TRENDSIZING: "off"
          MODE: run
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'yes' || '' }}
        run: node spy0dte/bot.js
      - name: Save the twin's files
        if: always()
        run: |
          git config user.name "spy0dte-twin"
          git config user.email "spy0dte-bot@users.noreply.github.com"
          git add spy0dte/twin_public 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "spy0dte twin $(TZ=America/New_York date +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 10; done
          fi
      - name: Send the twin's summary (GitHub issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(TZ=America/New_York date +%F)
          F="spy0dte/twin_public/summaries/$D.md"
          if [ -f "$F" ]; then
            gh issue create --title "SPY 0DTE TWIN (Public, dry, original rules) · $D · $(cat "spy0dte/twin_public/summaries/$D.title")" --body-file "$F" || true
          fi
